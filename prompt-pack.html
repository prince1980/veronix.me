<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Higgsfield Prompt Pack | Veronix Co</title>
  <meta content="Download the exclusive Higgsfield Prompt Pack by Veronix Co." name="description" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <meta name="robots" content="noindex, nofollow" />
  
  <!-- CSS -->
  <link href="./veronix.css" rel="stylesheet" type="text/css" />
  
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: var(--veronix-bg);
      color: var(--veronix-text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      font-family: 'Outfit', sans-serif;
    }
    
    .nav-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 30px;
      display: flex;
      justify-content: center;
    }
    
    .logo-img {
      width: 40px;
      height: 40px;
    }
    
    .download-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 100px 20px 40px 20px;
    }
    
    .glass-box {
      background: rgba(13, 11, 9, 0.6);
      border: 1px solid var(--veronix-stroke);
      padding: 60px 40px;
      border-radius: 24px;
      backdrop-filter: blur(20px);
      max-width: 500px;
      width: 100%;
    }
    
    .subtitle {
      color: var(--veronix-gold);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      font-weight: 600;
    }
    
    .title {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 30px 0;
      line-height: 1.2;
    }
    
    .download-button {
      display: inline-block;
      background: var(--veronix-gradient);
      color: var(--veronix-bg);
      padding: 18px 40px;
      border-radius: 40px;
      font-weight: 700;
      text-decoration: none;
      font-size: 16px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .download-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(197, 163, 88, 0.2);
    }
    
    @media screen and (max-width: 479px) {
      .glass-box {
        padding: 40px 20px;
      }
      .title {
        font-size: 26px;
      }
      .download-button {
        padding: 16px 30px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  
  <div class="nav-bar">
    <a href="./"><img src="./logo.png" alt="Veronix Logo" class="logo-img" /></a>
  </div>

  <div class="download-container">
    <div class="glass-box">
      <div class="subtitle">Exclusive Download</div>
      <h1 class="title">The Higgsfield Automation Prompt Pack</h1>
      <!-- We will link this directly to the PDF the user provides -->
      <a href="./Veronix%20x%20Higgsfield%20Prompt%20Pack.pdf" download class="download-button">Download PDF</a>
    </div>
  </div>

</body>
</html>
