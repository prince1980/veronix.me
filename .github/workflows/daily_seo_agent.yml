name: Daily SEO Agent

on:
  schedule:
    # Runs at 08:30 UTC every day (which is 2:00 PM IST)
    - cron: '30 8 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  generate-article:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push commits back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run SEO Generation Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python .github/scripts/generate_seo.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Veronix SEO Bot"
          git config --global user.email "bot@veronix.me"
          git add documentation/
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No new articles were generated. Skipping commit."
          else
            git commit -m "Automated SEO Article: Daily Content Generation"
            git push
          fi
